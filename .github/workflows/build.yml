name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  ARCH_DEPS: >-
    base-devel git rust cmake extra-cmake-modules
    qt6-base qt6-declarative kcoreaddons ki18n kcmutils kirigami
    hidapi libusb systemd-libs polkit hicolor-icon-theme
  UBUNTU_DEPS: >-
    build-essential cmake git ca-certificates pkgconf gettext dpkg-dev file
    rustc cargo extra-cmake-modules qt6-base-dev qt6-declarative-dev
    libkf6kcmutils-dev libkf6i18n-dev libkf6coreaddons-dev libkirigami-dev libudev-dev

jobs:
  # Builds the .deb packages and the release tarball from one compile. It runs
  # on the oldest Qt/glibc we ship to, so the tarball works on newer distros too.
  build:
    name: Build (Ubuntu 26.04)
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    steps:
      - name: Install dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          # shellcheck disable=SC2086 # split the package list on purpose
          apt-get install -y --no-install-recommends $UBUNTU_DEPS

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache cargo downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /github/home/.cargo/registry
            /github/home/.cargo/git
          key: cargo-ubuntu-${{ hashFiles('daemon/Cargo.lock') }}

      - name: Build
        # LIBEXECDIR is pinned so the daemon path baked into the unit files
        # is the same on every distro
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr \
            -DKDE_INSTALL_USE_QT_SYS_PATHS=ON -DKDE_INSTALL_LIBEXECDIR=lib
          cmake --build build -j"$(nproc)"

      - name: Check translations are up to date
        run: |
          # The checkout belongs to another user than the container's root
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          po/update.sh
          # POT-Creation-Date always changes; anything else means stale .po files
          if ! git diff --quiet -I '^"POT-Creation-Date:' -- po; then
            git --no-pager diff --stat -- po
            echo "::warning::po/ is out of date, run po/update.sh"
          fi

      - name: Build .deb
        run: cd build && cpack -G DEB

      - name: Build tarball
        run: |
          version=$(sed -n 's/^project(framework-kcm VERSION \([0-9.]*\)).*/\1/p' CMakeLists.txt)
          # Stripped like the .deb, so both ship identical binaries
          DESTDIR="$PWD/stage" cmake --install build --strip
          # Ubuntu's multiarch plugin dir to the upstream Qt default
          mkdir -p stage/usr/lib/qt6
          mv stage/usr/lib/x86_64-linux-gnu/qt6/plugins stage/usr/lib/qt6/
          rmdir stage/usr/lib/x86_64-linux-gnu/qt6 stage/usr/lib/x86_64-linux-gnu
          tar -C stage -czf "framework-kcm-$version-x86_64.tar.gz" --owner=0 --group=0 usr

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ubuntu-package
          path: build/*.deb
          if-no-files-found: error

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tarball
          path: framework-kcm-*-x86_64.tar.gz
          if-no-files-found: error

  gui-only:
    name: Build standalone GUI without Plasma or KCM dependencies
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential cmake extra-cmake-modules gettext libkf6i18n-dev \
            libkirigami-dev qt6-base-dev qt6-declarative-dev

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build standalone GUI
        run: |
          cmake -B build-gui -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr \
            -DBUILD_KCM=OFF -DBUILD_GUI=ON -DBUILD_DAEMON=OFF
          cmake --build build-gui --target framework-settings -j"$(nproc)"
          executable=build-gui/bin/framework-settings
          test -x "$executable"
          if ! linkage=$(ldd "$executable"); then
            echo "::error::Could not inspect standalone GUI shared-library dependencies"
            exit 1
          fi
          unresolved=$(printf '%s\n' "$linkage" | grep 'not found' || :)
          if [ -n "$unresolved" ]; then
            echo "::error::Standalone GUI has unresolved shared-library dependencies"
            printf '%s\n' "$unresolved"
            exit 1
          fi
          forbidden=$(printf '%s\n' "$linkage" | grep -E 'libKF6(KCMUtils|Plasma)|libPlasma' || :)
          if [ -n "$forbidden" ]; then
            echo "::error::Standalone GUI unexpectedly links KDE KCM or Plasma libraries"
            printf '%s\n' "$forbidden"
            exit 1
          fi

  version:
    name: Check tag matches version
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: check
        run: |
          tag="${GITHUB_REF_NAME#v}"
          cmake_version=$(sed -n 's/^project(framework-kcm VERSION \([0-9.]*\)).*/\1/p' CMakeLists.txt)
          cargo_version=$(sed -n 's/^version = "\(.*\)"/\1/p' daemon/Cargo.toml | head -n1)
          if [ "$tag" != "$cmake_version" ] || [ "$tag" != "$cargo_version" ]; then
            echo "::error::Tag v$tag doesn't match CMakeLists.txt ($cmake_version) and daemon/Cargo.toml ($cargo_version)"
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"

  # The split PKGBUILD builds from source, so this runs alongside the Ubuntu
  # build instead of reusing its binaries.
  arch-package:
    name: Package for Arch Linux
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install dependencies
        run: |
          # shellcheck disable=SC2086 # split the package list on purpose
          pacman -Syu --noconfirm --needed $ARCH_DEPS

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare sources
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          version=$(sed -n 's/^project(framework-kcm VERSION \([0-9.]*\)).*/\1/p' CMakeLists.txt)
          mkdir -p /tmp/pkg
          git archive --format=tar.gz --prefix="framework-settings-$version/" -o "/tmp/pkg/framework-settings-$version.tar.gz" HEAD
          cp packaging/arch/PKGBUILD packaging/arch/frameworkd.install /tmp/pkg/
          sed -i \
            -e "s|^pkgver=.*|pkgver=$version|" \
            -e "s|^url=.*|url='$GITHUB_SERVER_URL/$GITHUB_REPOSITORY'|" \
            /tmp/pkg/PKGBUILD

      - name: Build package
        run: |
          # makepkg refuses to run as root
          useradd -m builder
          chown -R builder /tmp/pkg
          su builder -c 'cd /tmp/pkg && makepkg --noconfirm'

      - name: Test install
        run: |
          find /tmp/pkg -maxdepth 1 -name '*.pkg.tar.zst' ! -name '*-debug-*' \
            -exec pacman -U --noconfirm {} +

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: arch-package
          # Leave out the -debug split package
          path: |
            /tmp/pkg/framework-*.pkg.tar.zst
            /tmp/pkg/frameworkd-*.pkg.tar.zst
            !/tmp/pkg/*-debug-*.pkg.tar.zst
          if-no-files-found: error

  deb-install-test:
    name: Test .deb install (Ubuntu 26.04)
    needs: build
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ubuntu-package

      - name: Install
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y ./*.deb

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [version, build, arch-package, deb-install-test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
          generate_release_notes: true

  stable-branch:
    name: Fast-forward stable branch
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A plain push only fast-forwards, so a tag that isn't ahead of stable fails here
      - name: Push release to stable
        run: git push origin "HEAD:refs/heads/stable"
